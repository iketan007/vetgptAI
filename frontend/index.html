<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petcare AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-sidebar:#0b1220;
    --bg-main:#141b2e;
    --bg-input:#26304a;
    --border:#2a3350;
    --text:#eef1f8;
    --text-dim:#8b93a7;
    --accent:#4f6cf6;
    --bubble-user:#4f6cf6;
    --bubble-bot:#1e2740;
    background:var(--bg-main);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    padding:0;
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg-main);
    color:var(--text);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  .app{
    display:flex;
    height:100%;
    min-height:100vh;
  }

  /* Sidebar */
  .sidebar{
    width:260px;
    flex-shrink:0;
    background:var(--bg-sidebar);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:22px 20px;
    border-right:1px solid var(--border);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    font-size:18px;
  }
  .brand-emoji{
    font-size:22px;
  }
  .logout{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--text);
    font-weight:600;
    font-size:15px;
    background:none;
    border:none;
    cursor:pointer;
    padding:8px 4px;
    border-radius:8px;
    opacity:0.9;
  }
  .logout:hover{ opacity:1; background:rgba(255,255,255,0.04); }

  /* Main */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    position:relative;
  }

  .welcome{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .welcome-emoji{
    font-size:56px;
    margin-bottom:14px;
  }
  .welcome h1{
    font-size:32px;
    font-weight:600;
    margin:0 0 10px 0;
  }
  .welcome p{
    color:var(--text-dim);
    font-size:15px;
    font-weight:500;
    margin:0;
  }

  /* Chat */
  .chat{
    flex:1;
    overflow-y:auto;
    display:none;
    flex-direction:column;
    gap:16px;
    padding:32px 12% 20px;
  }
  .chat.active{ display:flex; }
  .welcome.hidden{ display:none; }

  .msg{
    max-width:70%;
    padding:12px 16px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--bubble-user);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg.bot{
    align-self:flex-start;
    background:var(--bubble-bot);
    color:var(--text);
    border-bottom-left-radius:4px;
  }
  .msg.bot.typing{
    color:var(--text-dim);
    font-style:italic;
  }

  /* Input bar */
  .input-bar-wrap{
    padding:16px 12%;
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  }
  .input-bar{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--bg-input);
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px 8px 6px 18px;
  }
  .input-bar input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    padding:12px 0;
  }
  .input-bar input::placeholder{
    color:var(--text-dim);
  }
  .send-btn{
    background:var(--accent);
    border:none;
    color:#fff;
    width:38px;
    height:38px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .send-btn:disabled{
    opacity:0.5;
    cursor:default;
  }
  .send-btn svg{ width:18px; height:18px; }

  @media (max-width: 720px){
    .sidebar{ width:76px; padding:18px 10px; }
    .brand span.label{ display:none; }
    .logout span.label{ display:none; }
    .chat{ padding:24px 5% 16px; }
    .input-bar-wrap{ padding:14px 5%; }
    .msg{ max-width:85%; }
  }

  :root:not([data-theme="light"]) { color-scheme: dark; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-emoji">🐶</span>
      <span class="label">Petcare AI</span>
    </div>
    <button class="logout" id="logoutBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span class="label">Logout</span>
    </button>
  </aside>

  <main class="main">
    <div class="welcome" id="welcome">
      <div class="welcome-emoji">🐶</div>
      <h1>Petcare AI</h1>
      <p>Your One-stop Solution for your Little Fur Baby</p>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-bar-wrap">
      <div class="input-bar">
        <input type="text" id="askInput" placeholder="Ask Anything" autocomplete="off">
        <button class="send-btn" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<script>
  // Point this at your running FastAPI backend (see backend/README / app.main).
  // Defaults to localhost:8000 for local development.
  const API_BASE_URL = window.VETGPT_API_BASE_URL || 'http://localhost:8000';

  const welcome = document.getElementById('welcome');
  const chat = document.getElementById('chat');
  const input = document.getElementById('askInput');
  const sendBtn = document.getElementById('sendBtn');
  const logoutBtn = document.getElementById('logoutBtn');

  let history = [];

  function addMessage(role, text){
    const el = document.createElement('div');
    el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  function showChat(){
    welcome.classList.add('hidden');
    chat.classList.add('active');
  }

  async function handleSend(){
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    sendBtn.disabled = true;

    showChat();
    addMessage('user', text);

    const typingEl = addMessage('bot', 'Typing...');
    typingEl.classList.add('typing');

    try {
      const response = await fetch(`${API_BASE_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history })
      });

      if (!response.ok) {
        throw new Error(`Backend returned ${response.status}`);
      }

      const data = await response.json();
      typingEl.classList.remove('typing');
      typingEl.textContent = data.answer;

      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: data.answer });
    } catch (err) {
      typingEl.classList.remove('typing');
      typingEl.textContent = "Couldn't reach the VetGPT backend. Make sure the FastAPI server is running at " + API_BASE_URL + ".";
    } finally {
      sendBtn.disabled = false;
      chat.scrollTop = chat.scrollHeight;
    }
  }

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSend();
  });

  logoutBtn.addEventListener('click', () => {
    history = [];
    chat.innerHTML = '';
    chat.classList.remove('active');
    welcome.classList.remove('hidden');
    input.value = '';
  });
</script>
</body>
</html>
